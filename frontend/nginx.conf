# nginx_buildpack template: {{port}} and {{env "..."}} are filled in at staging.
worker_processes 1;
daemon off;

error_log stderr;
events { worker_connections 1024; }

http {
  charset utf-8;
  log_format cloudfoundry 'NginxLog "$request" $status $body_bytes_sent';
  access_log /dev/stdout cloudfoundry;
  default_type application/octet-stream;
  types {
    text/html                html;
    text/css                 css;
    application/javascript   js;
    application/json         json;
    image/svg+xml            svg;
    image/png                png;
    image/x-icon             ico;
  }
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30;
  port_in_redirect off;
  server_tokens off;

  server {
    listen {{port}};
    root public;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;
    }

    # Agents, IAS sign-in and report downloads live on the backend app.
    location ~ ^/(a2a|auth|reports)/ {
      proxy_pass {{env "BACKEND_URL"}};
      # Host stays the backend's own host (proxy_pass default) so the CF router
      # routes it there; SNI is needed for the router's TLS.
      proxy_ssl_server_name on;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      # LLM tool-calling runs and report builds can take minutes.
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_buffering off;
      client_max_body_size 20m;
    }
  }
}
