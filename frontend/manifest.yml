# Frontend app: serves frontend/public/ with nginx and passes /a2a/, /auth/ and
# /reports/ through to the backend app (manifest.yml at the repo root), so the
# page keeps calling the agents same-origin - no CORS, and the IAS session
# cookie is set on this app's host.
#
# Deploy from the repo root:  cf push -f frontend/manifest.yml
applications:
  - name: smart-material-ai-role-ui
    path: .
    memory: 64M
    disk_quota: 256M
    buildpacks:
      - nginx_buildpack
    env:
      # Backend app's route - scheme + host only, no trailing slash.
      BACKEND_URL: https://smart-material-ai-role.cfapps.us10-001.hana.ondemand.com
