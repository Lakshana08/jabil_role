schema_version: 3.28.0
metadata:
  namespace: joule.ext
  name: smart_material_capability
  version: 1.0.12
  display_name: Smart Material AI
  description: >-
    Query the Smart Material CDS views in S/4HANA - material master, stock,
    aged inventory, over-control, production orders and shortages; create
    and update material masters and production orders; and generate
    downloadable reports of any of this data, via A2A agents.

system_aliases:
  SMART_MATERIAL_QUERY:
    destination: SMART_MATERIAL_QUERY
  SMART_MATERIAL_ACTION:
    destination: SMART_MATERIAL_ACTION
  SMART_MATERIAL_REPORT:
    destination: SMART_MATERIAL_REPORT





