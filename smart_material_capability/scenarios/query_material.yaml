description: >-
  Looks up material master data, stock levels, serial numbers and production
  orders in S/4HANA. Use when the user asks about the stock for a material,
  material master details, a production order, production orders for a
  plant or material, or how many material masters, stock records,
  production orders or serial numbers exist in total. NOT for inventory
  aging, non-controlled or over-control/over-issued status, or machine-head
  review - those are the material status check. Also NOT for generating,
  exporting or downloading a report or file (CSV, Excel, PDF): any "Generate
  a ... report ..." message belongs to the report scenario, even when it
  names a production order, material or plant. Example phrasings: "what's
  the stock for material MAT-1000?", "show me production order 60001234",
  "show production orders for plant 1710", "how many production orders are
  there in total?".
target:
  name: querymaterialfunction
  type: function
