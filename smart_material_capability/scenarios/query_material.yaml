description: >-
  Looks up and counts S/4HANA material and production data from the Smart
  Material CDS views: material master, MRP / valuation / storage location /
  BOM data, stock and inventory value, aged inventory (aging days), over-control
  / over-issued, non-controlled and available-to-issue material, putaway-pending
  and -S (dummy) materials, work-order components, 14C component issuance,
  COOIS / NMVT order status, production orders with their components,
  operations and statuses, machine-head material, and work orders with missing
  parts or component shortages. Use for any question about this data, including
  "how many ..." and "next rows" follow-ups ("..., rows 21-40"). NOT for
  generating, exporting or downloading a report or file (CSV, Excel, PDF): any
  "Generate a ... report ..." message belongs to the report scenario. NOT for
  creating or changing SAP data. Example phrasings: "any over-issued materials
  in storage location A301?", "show the 10 oldest aged materials", "which work
  orders have missing parts?", "what's short for production order 121060001?",
  "how many non-controlled materials are there?", "show the BOM of material
  PBC2731181A0B", "which orders are excluded with NMVT status?".
target:
  name: querymaterialfunction
  type: function
