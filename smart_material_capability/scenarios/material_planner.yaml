description: >-
  Material Planner: looks up and counts S/4HANA material and production data -
  material master, MRP / valuation / storage location / BOM data, stock and
  inventory value, aged inventory, over-control / over-issued WIP,
  non-controlled and available-to-issue material, putaway-pending and -S
  materials, work-order components, 14C issuance, COOIS / NMVT order status,
  production orders, and work orders with missing parts or component
  shortages. Use for any question about this data, including "how many ..."
  and "next rows" follow-ups ("..., rows 21-40"). NOT for generating or
  downloading a report or file (CSV, Excel, PDF): any "Generate a ... report"
  message belongs to the report scenario. Examples: "any over-issued materials
  in storage location A301?", "show the 10 oldest aged materials", "what is
  short for work order 121060001, and what is aged?", "which work orders have
  missing parts?", "show the BOM of material PBC2731181A0B".
target:
  name: materialplannerfunction
  type: function
# Planner role only: Joule offers this scenario only to users in the IAS group
# "Planner" (case-sensitive), read from the user's IAS token. Other users never
# get it - Joule just doesn't pick it. More roles later: add their group under values.
visibility_condition:
  objects:
    - type: ias_attributes
      attributes:
        - attribute: groups
          match: ANY
          values:
            - Planner
