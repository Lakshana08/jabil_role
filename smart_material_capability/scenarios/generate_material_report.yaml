description: >-
  Generates a downloadable PDF, Excel or CSV report of any Smart Material data
  in S/4HANA: material master, MRP / valuation / BOM data, stock, inventory,
  aged inventory, over-control / over-issued, non-controlled and issuable
  material, putaway-pending and -S materials, work-order components, 14C
  issuance, order status, production orders (components, operations, statuses),
  work-order and component shortages. Use when the user asks to export,
  generate or download a report or file. Every message that starts with
  "Generate a ... report" belongs here - including the texts sent by the CSV /
  Excel / PDF report buttons. Example phrasings: "Generate an over-control
  material report in storage location A301 in Excel format", "Generate an aged
  inventory report where AgingDays > 90 in CSV format", "give me a PDF of
  component shortages for order 121060001", "export the work orders with
  missing parts to Excel".
target:
  name: generatematerialreport
  type: function
# Planner role only: Joule offers this scenario only to users in the IAS group
# "Planner" (case-sensitive), read from the user's IAS token. Other users never
# get it - Joule just doesn't pick it. More roles later: add their group under values.
visibility_condition:
  objects:
    - type: ias_attributes
      attributes:
        - attribute: groups
          match: ANY
          values:
            - Planner
