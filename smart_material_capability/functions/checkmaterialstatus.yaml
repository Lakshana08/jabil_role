action_groups:
  - actions:
      - type: agent-request
        system_alias: SMART_MATERIAL_STATUS
        agent_type: remote
        result_variable: agentResult
      # agentResult.body is already the unwrapped Task (no extra .result
      # envelope layer). Root cause of every prior failure: the agent used to
      # enqueue a submitted Task then a separate completed status update -
      # Joule's agent-request captured the submitted event (status={state:
      # submitted}, no message at all) before the completed update applied.
      # The agent now enqueues a single already-completed Task, so
      # status.message is always present here.
      - type: set-variables
        variables:
          - name: replyText
            value: <? agentResult.body.status.message.parts[0].text ?>
      - type: message
        message:
          type: text
          content: "<? replyText ?>"
  # "Show next 20" for large results - see querymaterialfunction.yaml.
  - condition: "agentResult.body.status.message.parts.size() > 1 ? agentResult.body.status.message.parts[1].data.next_page_prompt != null : false"
    actions:
      - type: message
        message:
          type: buttons
          content:
            title: More rows are available
            buttons:
              - type: postback
                title: Show next 20
                value: "<? agentResult.body.status.message.parts[1].data.next_page_prompt ?>"
